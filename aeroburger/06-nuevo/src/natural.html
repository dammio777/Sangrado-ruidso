<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aero Burger — Menú de a bordo (natural)</title>
<style>@font-face{font-family:'AirbusSlab';src:url('../assets/Bevan-Regular.ttf')}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =========================================================================
   Aero Burger · "Menú de a bordo" v2 · versión NATURAL · Reel 1080x1920 @60fps
   Cada plato ocupa la pantalla completa; la interfaz va pequeña encima.
   Cada página dura 1 compás de la música (114,3 BPM → 2,1 s).
   ========================================================================= */
const W=1080, H=1920;
const TEXT='"Inter", sans-serif', DISP='"Inter Display", "Inter", sans-serif', SLAB='"AirbusSlab", serif';
const WHITE='#FFFFFF', W80='rgba(255,255,255,.84)', W60='rgba(255,255,255,.62)';
const NIGHT='saturate(0.9) sepia(0.08) contrast(0.98) brightness(1.03)';
const PAGES=[
  {img:'cta',      name:'Clásica CTA',               desc:'Nuestra hamburguesa clásica.',     ax:0.45, ay:0.45, f:NIGHT},
  {img:'airbus',   name:'Airbus',                    desc:'Doble carne · 400 g de res.',      ax:0.55, ay:0.60, f:'none'},
  {img:'sanduche', name:'Sánduche de la casa',       desc:'Pan artesanal a base de orégano.', ax:0.75, ay:0.40, f:'none'},
  {img:'torre',    name:'Torre de control personal', desc:'Para ti solo, bien cargada.',      ax:0.48, ay:0.45, f:'none'},
  {img:'gavilan',  name:'Gavilán',                   desc:'Desgranado especial.',             ax:0.42, ay:0.50, f:'none'},
  {img:'bebidas',  name:'Bebidas de la casa',        desc:'Para acompañar el vuelo.',         ax:0.55, ay:0.50, f:NIGHT},
];
const BAR=2.1, I0=2.6, I1=I0+PAGES.length*BAR;     // 15.2
const F0=I1, F1=F0+2*BAR;                          // chimenea 15.2–19.4
const M0=F1, DURATION=M0+5.2; window.DURATION=DURATION;   // mapa y cierre hasta 24.6

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,e)=>a+(b-a)*e;
const eOut=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function cover(ctx,img,k=1,ax=0.5,ay=0.5){ const s=Math.max(W/img.width,H/img.height)*k; const dw=img.width*s, dh=img.height*s; ctx.drawImage(img,(W-dw)*ax,(H-dh)*ay,dw,dh); }
const IMG={};
function loadImg(src){ const img=new Image(); img.src=src; return img.decode().then(()=>img); }
function txt(ctx,str,x,y,font,col,tIn,tOut,t,o={}){
  const a=eOut(prog(t,tIn,tIn+0.45))*(tOut==null?1:1-eInOut(prog(t,tOut,tOut+0.22)));
  if(a<=0) return;
  ctx.save(); ctx.globalAlpha*=a; ctx.font=font; ctx.textAlign=o.align||'left'; ctx.fillStyle=col; if(o.ls) ctx.letterSpacing=o.ls+'px';
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=18; ctx.shadowOffsetY=2;
  ctx.fillText(str,x,y+(1-a)*14); ctx.restore();
}
function plane(ctx,x,y,s,col){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(0,0,0.5,0.065,0,0,Math.PI*2); ctx.fill();
  for(const k of [1,-1]){
    ctx.beginPath(); ctx.moveTo(0.12,-0.05*k); ctx.lineTo(-0.12,-0.48*k); ctx.lineTo(-0.24,-0.48*k); ctx.lineTo(-0.12,-0.05*k); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.36,-0.04*k); ctx.lineTo(-0.47,-0.2*k); ctx.lineTo(-0.53,-0.2*k); ctx.lineTo(-0.49,-0.04*k); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function shade(ctx,dark=0){
  let g=ctx.createLinearGradient(0,1160,0,H); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.55,'rgba(0,0,0,.45)'); g.addColorStop(1,'rgba(0,0,0,.65)'); ctx.fillStyle=g; ctx.fillRect(0,1160,W,H-1160);
  g=ctx.createLinearGradient(0,0,0,330); g.addColorStop(0,'rgba(0,0,0,.42)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,330);
  if(dark>0){ ctx.fillStyle=`rgba(0,0,0,${dark})`; ctx.fillRect(0,0,W,H); }
}

function media(ctx,t){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const XF=0.14;
  // intro: la terraza de noche, oscurecida, con el título
  const ia=1-prog(t,I0-XF,I0);
  if(ia>0){ ctx.save(); ctx.globalAlpha=ia; cover(ctx,IMG.intro,lerp(1.12,1.04,eOut(prog(t,0,I0))),0.5,0.5); ctx.restore(); }
  // páginas a pantalla completa con un acercamiento lento
  for(let i=0;i<PAGES.length;i++){
    const p=PAGES[i], a=I0+i*BAR, b=a+BAR;
    const al=prog(t,a-XF,a)*(i===PAGES.length-1?1-prog(t,F0-XF,F0):1-prog(t,b-XF,b));
    if(al<=0) continue;
    ctx.save(); ctx.globalAlpha=al; ctx.filter=p.f; cover(ctx,IMG[p.img],lerp(1.0,1.05,prog(t,a-XF,b)),p.ax,p.ay); ctx.filter='none'; ctx.restore();
  }
  // chimenea
  const fa=prog(t,F0-XF,F0);
  if(fa>0){ ctx.save(); ctx.globalAlpha=fa; ctx.filter='brightness(1.05)'; cover(ctx,IMG.fire,lerp(1.12,1.03,prog(t,F0,DURATION)),0.5,0.5); ctx.filter='none'; ctx.restore(); }
  shade(ctx, ia>0? 0.38*ia : 0.0);
  // cierre: más oscuro para el mapa
  const d=eInOut(prog(t,M0,M0+0.5)); if(d>0){ ctx.fillStyle=`rgba(10,6,4,${0.55*d})`; ctx.fillRect(0,0,W,H); }
}

function ui(ctx,t){
  const X=80;
  // marca arriba
  const ma=eOut(prog(t,0.2,0.8));
  if(ma>0){ ctx.save(); ctx.globalAlpha=ma*0.92; ctx.beginPath(); ctx.arc(108,214,28,0,Math.PI*2); ctx.clip(); ctx.drawImage(IMG.logo,80,186,56,56); ctx.restore();
    txt(ctx,'AERO BURGER  ·  MENÚ DE A BORDO',152,223,`600 24px ${TEXT}`,W80,0.2,null,t,{ls:4}); }
  // intro
  txt(ctx,'MENÚ',X,1420,`400 120px ${SLAB}`,WHITE,0.35,I0-0.3,t,{ls:3});
  txt(ctx,'DE A BORDO',X,1520,`400 78px ${SLAB}`,WHITE,0.5,I0-0.3,t,{ls:3});
  txt(ctx,'Hoy despegamos con…',X,1590,`500 40px ${TEXT}`,W80,0.8,I0-0.3,t);
  // páginas
  for(let i=0;i<PAGES.length;i++){
    const p=PAGES[i], a=I0+i*BAR, b=a+BAR;
    txt(ctx,`${String(i+1).padStart(2,'0')} / ${String(PAGES.length).padStart(2,'0')}`,X,1440,`600 26px ${TEXT}`,W60,a+0.05,b-0.25,t,{ls:3});
    txt(ctx,p.name,X,1515,`700 ${p.name.length>20?54:64}px ${DISP}`,WHITE,a+0.1,b-0.25,t,{ls:-1});
    txt(ctx,p.desc,X,1572,`500 36px ${TEXT}`,W80,a+0.2,b-0.22,t);
  }
  // barras de progreso tipo historia (discretas)
  const pa=eOut(prog(t,I0,I0+0.3))*(1-eInOut(prog(t,I1-0.25,I1)));
  if(pa>0){ ctx.save(); ctx.globalAlpha=pa*0.9; const n=PAGES.length, gap=8, w=(W-160-gap*(n-1))/n;
    for(let i=0;i<n;i++){ const x=80+i*(w+gap); ctx.fillStyle='rgba(255,255,255,.3)'; rr(ctx,x,1625,w,4,2); ctx.fill();
      const f=clamp((t-I0-i*BAR)/BAR); if(f>0){ ctx.fillStyle=WHITE; rr(ctx,x,1625,Math.max(4,w*f),4,2); ctx.fill(); } }
    ctx.restore(); }
  // chimenea
  txt(ctx,'Noches frías,',X,1470,`700 70px ${DISP}`,WHITE,F0+0.2,F1-0.3,t,{ls:-1.5});
  txt(ctx,'chimenea encendida.',X,1555,`700 70px ${DISP}`,'#F6C27E',F0+0.4,F1-0.3,t,{ls:-1.5});
  // mapa y cierre
  const T0=M0+0.1;
  txt(ctx,'¿CÓMO LLEGAR?',540,420,`600 26px ${TEXT}`,W80,T0,null,t,{ls:6,align:'center'});
  txt(ctx,'Desde El Silletero, sigue la ruta.',540,490,`700 50px ${DISP}`,WHITE,T0+0.1,null,t,{ls:-1,align:'center'});
  const p=eOut(prog(t,T0+0.2,T0+0.8));
  if(p>0){ const w=920, h=Math.round(w*IMG.mapa.height/IMG.mapa.width), x=80, y=560+(1-p)*50;
    ctx.save(); ctx.globalAlpha=p; ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=50; ctx.shadowOffsetY=18; rr(ctx,x,y,w,h,24); ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowColor='transparent';
      rr(ctx,x,y,w,h,24); ctx.clip(); ctx.drawImage(IMG.mapa,x,y,w,h); ctx.restore(); }
  txt(ctx,'Aero Burger · Santa Elena',X,1440,`700 50px ${DISP}`,WHITE,T0+0.9,null,t,{ls:-1});
  txt(ctx,'Ven al local o pide domicilio en Santa Elena.',X,1500,`500 34px ${TEXT}`,W80,T0+1.05,null,t);
  txt(ctx,'@aero.burger',X,1565,`700 38px ${TEXT}`,WHITE,T0+1.2,null,t);
  const pp=prog(t,T0+1.3,T0+3.0); if(pp>0&&pp<1){ ctx.save(); ctx.globalAlpha=0.75*Math.sin(Math.PI*pp); plane(ctx,lerp(-60,W+60,eInOut(pp)),1330,44,WHITE); ctx.restore(); }
}
function render(ctx,t){ media(ctx,t); ui(ctx,t); }
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
window.seek=async function(t){ render(ctx,t); };
window.ready=(async()=>{
  await Promise.all([document.fonts.load(`400 80px AirbusSlab`),document.fonts.load(`700 80px "Inter Display"`),document.fonts.load(`500 30px "Inter"`),document.fonts.load(`600 30px "Inter"`),document.fonts.load(`700 30px "Inter"`)]);
  for(const [k,s] of [['cta','n_cta.jpg'],['airbus','n_airbus_sr.png'],['sanduche','n_sanduche.jpg'],['torre','n_torre_sr.png'],['gavilan','n_gavilan_sr.png'],['bebidas','n_bebidas.jpg'],['fire','fire_sr.png'],['mapa','mapa.jpg'],['logo','logo_crop.png'],['intro','n_intro_terraza.jpg']]) IMG[k]=await loadImg('../assets/'+s);
  await window.seek(parseFloat(new URLSearchParams(location.search).get('t')||'0'));
  return true;
})();
</script>
</body>
</html>
