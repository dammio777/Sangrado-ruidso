<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aero Burger — Ir a Burger</title>
<style>@font-face{font-family:'AirbusSlab';src:url('../assets/Bevan-Regular.ttf')}
html,body{margin:0;background:#120B07;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =========================================================================
   Aero Burger · "Ir a Burger" · Reel 1080x1920 @60fps (33 s a 1,35x)
   Versión visual del Menú de a bordo: abre con una FOTO REAL en primer plano
   (la Airbus en plano macro que se aleja), los platos a pantalla completa,
   la chimenea y el mapa. Misma rejilla musical que 'cozy menu' (80 BPM):
   compás 0 = gancho · compases 1-6 = platos · 7-8 = chimenea · 9-10 = mapa.
   Animación determinista: window.seek(t).
   ========================================================================= */
const W=1080, H=1920;
const TEXT='"Inter", sans-serif', DISP='"Inter Display", "Inter", sans-serif', SLAB='"AirbusSlab", serif';
const CREAM='#EFE8DE', INK='#3B3229', SOFT='rgba(59,50,41,.58)', LIGHT='#FBF6EE', AMBER='#F2B467';
const DISHES=[
  {img:'airbus',   mode:'airbus', name:'Airbus',                    desc:'Doble carne · 400 g de res.'},
  {img:'cta',      mode:'cover',  name:'Clásica CTA',               desc:'Nuestra hamburguesa clásica.', ax:.5, ay:.5},
  {img:'sanduche', mode:'cover',  name:'Sánduche de la casa',       desc:'Pan artesanal a base de orégano.', ax:.5, ay:.5},
  {img:'torre',    mode:'cover',  name:'Torre de control personal', desc:'Para ti solo, bien cargada.', ax:.5, ay:.52},
  {img:'gavilan',  mode:'cover',  name:'Gavilán',                   desc:'Desgranado especial.', ax:.52, ay:.5},
  {img:'bebidas',  mode:'cover',  name:'Bebidas de la casa',        desc:'Para acompañar el vuelo.', ax:.5, ay:.5},
];
const ID=2.22222, I0=ID, I1=I0+DISHES.length*ID;   // 1 compás = 3,0 s en el video final
const F0=I1, F1=F0+2*ID, M0=F1;
const DURATION=M0+2*ID; window.DURATION=DURATION;
const START=DISHES.map((d,i)=> i===0 ? 0 : I0+i*ID);   // la Airbus empieza en el gancho (misma foto)
const END=DISHES.map((d,i)=> I0+(i+1)*ID);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,e)=>a+(b-a)*e;
const eOut=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function cover(ctx,img,x,y,w,h,k=1,ax=0.5,ay=0.5){ const s=Math.max(w/img.width,h/img.height)*k; const dw=img.width*s, dh=img.height*s; ctx.drawImage(img,x+(w-dw)*ax,y+(h-dh)*ay,dw,dh); }
function txt(ctx,str,x,y,font,col,align,tIn,tOut,t,o={}){
  const a=eOut(prog(t,tIn,tIn+(o.d||0.5)))*(tOut==null?1:1-eInOut(prog(t,tOut,tOut+0.3)));
  if(a<=0) return;
  ctx.save(); ctx.globalAlpha*=a; ctx.font=font; ctx.textAlign=align; ctx.fillStyle=col; if(o.ls) ctx.letterSpacing=o.ls+'px';
  if(o.shadow){ ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=26; ctx.shadowOffsetY=2; }
  ctx.fillText(str,x,y+(1-a)*(o.dy??16)); ctx.restore();
}
function logo(ctx,x,y,r,a=1){ ctx.save(); ctx.globalAlpha*=a; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip(); ctx.drawImage(IMG.logo,x-r,y-r,2*r,2*r); ctx.restore(); }
const IMG={}, BD={};
function loadImg(src){ const img=new Image(); img.src=src; return img.decode().then(()=>img); }
const FILT='contrast(0.98) saturate(0.97) brightness(1.02)';   // colores naturales

// fondo desenfocado de la misma foto (rellena lo que la foto no cubre)
function makeBackdrop(img){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const s=document.createElement('canvas'); s.width=108; s.height=192; const sx=s.getContext('2d'); sx.imageSmoothingQuality='high'; cover(sx,img,0,0,108,192,1,0.5,0.5);
  x.imageSmoothingQuality='high'; x.filter='blur(14px)'; x.drawImage(s,-40,-70,W+80,H+140); x.filter='none';
  x.fillStyle='rgba(16,10,7,.38)'; x.fillRect(0,0,W,H); return c;
}
// foto con los bordes superior e inferior difuminados (se funde con el fondo)
const lay=document.createElement('canvas'); lay.width=W; lay.height=H; const lx=lay.getContext('2d');
function feathered(ctx,img,L,T,w,h,f){
  lx.globalCompositeOperation='source-over'; lx.clearRect(0,0,W,H); lx.imageSmoothingQuality='high'; lx.drawImage(img,L,T,w,h);
  const g=lx.createLinearGradient(0,T,0,T+h), q=Math.min(.45,f/h);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(q,'rgba(0,0,0,1)'); g.addColorStop(1-q,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
  lx.globalCompositeOperation='destination-in'; lx.fillStyle=g; lx.fillRect(0,0,W,H); lx.globalCompositeOperation='source-over';
  ctx.save(); ctx.filter=FILT; ctx.drawImage(lay,0,0); ctx.restore();
}

function drawDish(ctx,i,t,alpha){
  const d=DISHES[i], k=lerp(1.0,1.07,prog(t,START[i]-0.5,END[i]));
  ctx.save(); ctx.globalAlpha=alpha; ctx.imageSmoothingQuality='high';
  ctx.drawImage(BD[d.img],0,0);
  if(d.mode==='cover'){ ctx.filter=FILT; cover(ctx,IMG[d.img],0,0,W,H,k,d.ax,d.ay); ctx.filter='none'; }
  else if(d.mode==='airbus'){
    // plano macro (queso y carne) que se aleja hasta mostrar la hamburguesa completa
    const p=1-Math.pow(1-prog(t,0,4.4),2.2), s=lerp(1.6,0.8,p);
    feathered(ctx,IMG.airbus,lerp(-740,-112,p),lerp(-680,138,p),1630*s,1630*s,170);
  } else {
    const w=W*d.fw*k, h=w*IMG[d.img].height/IMG[d.img].width;
    feathered(ctx,IMG[d.img],540-w/2,d.cy-h/2,w,h,170);
  }
  const g=ctx.createLinearGradient(0,1060,0,H); g.addColorStop(0,'rgba(18,11,7,0)'); g.addColorStop(.5,'rgba(18,11,7,.55)'); g.addColorStop(1,'rgba(18,11,7,.88)');
  ctx.fillStyle=g; ctx.fillRect(0,1060,W,H-1060);
  const g2=ctx.createLinearGradient(0,0,0,300); g2.addColorStop(0,'rgba(18,11,7,.5)'); g2.addColorStop(1,'rgba(18,11,7,0)'); ctx.fillStyle=g2; ctx.fillRect(0,0,W,300);
  ctx.restore();
}
function dishTexts(ctx,t){
  txt(ctx,'EN LA CARTA',W-90,138,`600 24px ${TEXT}`,'rgba(251,246,238,.85)','right',I0-0.3,I1-0.3,t,{ls:5,dy:10,shadow:true});
  for(let i=0;i<DISHES.length;i++){
    const d=DISHES[i], a=I0+i*ID, tin=a+(i===0?0.1:-0.1), tout=i<DISHES.length-1?a+ID-0.35:I1-0.3;
    txt(ctx,String(i+1).padStart(2,'0')+' / '+String(DISHES.length).padStart(2,'0'),90,138,`600 28px ${TEXT}`,'rgba(251,246,238,.85)','left',tin,tout,t,{dy:10,shadow:true});
    txt(ctx,d.name,540,1560,`700 ${d.name.length>20?60:72}px ${DISP}`,LIGHT,'center',tin+0.05,tout,t,{ls:-1.5,shadow:true});
    txt(ctx,d.desc,540,1626,`500 36px ${TEXT}`,'rgba(251,246,238,.84)','center',tin+0.17,tout,t,{shadow:true});
  }
}
// gancho: título sobre la foto macro de la Airbus
function sHook(ctx,t){
  if(t>2.2) return;
  const out=1-eInOut(prog(t,1.55,2.0));
  ctx.save(); ctx.globalAlpha=out;
  logo(ctx,540,170,46,eOut(prog(t,0.2,0.8)));
  txt(ctx,'AERO BURGER  ·  SANTA ELENA',540,1360,`600 26px ${TEXT}`,'rgba(251,246,238,.85)','center',0.25,null,t,{ls:6,shadow:true});
  const a=eOut(prog(t,0.35,1.0));
  if(a>0){
    ctx.save(); ctx.globalAlpha*=a; ctx.font=`400 100px ${SLAB}`; ctx.letterSpacing='3px';
    const w100=ctx.measureText('Ir a Burger').width, size=Math.min(150,940/w100*100); ctx.font=`400 ${size}px ${SLAB}`;
    const w1=ctx.measureText('Ir a ').width, w2=ctx.measureText('Burger').width, x0=540-(w1+w2)/2, y=1490+(1-a)*22;
    ctx.textAlign='left'; ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=30; ctx.shadowOffsetY=3;
    ctx.fillStyle=LIGHT; ctx.fillText('Ir a ',x0,y); ctx.fillStyle=AMBER; ctx.fillText('Burger',x0+w1,y); ctx.restore();
  }
  txt(ctx,'Esto te espera.',540,1575,`500 40px ${TEXT}`,'rgba(251,246,238,.88)','center',1.0,null,t,{shadow:true});
  ctx.restore();
}
function sFire(ctx,t){
  if(t<F0-0.4||t>F1+0.5) return;
  const a=eInOut(prog(t,F0-0.35,F0+0.2))*(1-eInOut(prog(t,F1-0.2,F1+0.3)));
  ctx.save(); ctx.globalAlpha=a; ctx.filter='contrast(1.02) saturate(1.05) brightness(1.05)';
  cover(ctx,IMG.fire,0,0,W,H,lerp(1.12,1.04,prog(t,F0-0.4,F1+0.5)),0.5,0.5); ctx.filter='none';
  let g=ctx.createLinearGradient(0,900,0,H); g.addColorStop(0,'rgba(20,12,8,0)'); g.addColorStop(0.55,'rgba(20,12,8,.6)'); g.addColorStop(1,'rgba(20,12,8,.8)'); ctx.fillStyle=g; ctx.fillRect(0,900,W,H-900);
  ctx.restore();
  ctx.save(); ctx.globalAlpha=a;
  txt(ctx,'Noches frías,',540,1300,`700 76px ${DISP}`,'#FBF6EE','center',F0+0.2,F1-0.35,t,{ls:-2,shadow:true});
  txt(ctx,'chimenea encendida.',540,1390,`700 76px ${DISP}`,AMBER,'center',F0+0.4,F1-0.3,t,{ls:-2,shadow:true});
  ctx.restore();
}
function sMap(ctx,t){
  if(t<M0-0.1) return;
  const T0=M0+0.1;
  txt(ctx,'¿CÓMO LLEGAR?',540,330,`600 28px ${TEXT}`,SOFT,'center',T0,null,t,{ls:7});
  txt(ctx,'Desde El Silletero,',540,420,`700 64px ${DISP}`,INK,'center',T0+0.1,null,t,{ls:-1.5});
  txt(ctx,'sigue la ruta.',540,495,`700 64px ${DISP}`,INK,'center',T0+0.2,null,t,{ls:-1.5});
  const p=eOut(prog(t,T0+0.25,T0+0.9));
  if(p>0){
    const w=900, h=Math.round(900*IMG.mapa.height/IMG.mapa.width), x=90, y=580+(1-p)*60;
    ctx.save(); ctx.globalAlpha=p;
    ctx.shadowColor='rgba(59,50,41,.16)'; ctx.shadowBlur=60; ctx.shadowOffsetY=22; rr(ctx,x,y,w,h,28); ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowColor='transparent';
    ctx.save(); rr(ctx,x,y,w,h,28); ctx.clip(); ctx.drawImage(IMG.mapa,x,y,w,h); ctx.restore();
    rr(ctx,x+.5,y+.5,w-1,h-1,28); ctx.strokeStyle='rgba(59,50,41,.12)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }
  logo(ctx,540,1430,52,eOut(prog(t,T0+1.0,T0+1.5)));
  txt(ctx,'Aero Burger  ·  Santa Elena',540,1540,`600 38px ${TEXT}`,INK,'center',T0+1.15,null,t);
  txt(ctx,'Ven al local o pide domicilio en Santa Elena.',540,1595,`500 32px ${TEXT}`,SOFT,'center',T0+1.3,null,t);
  txt(ctx,'@aero.burger',540,1665,`700 36px ${TEXT}`,INK,'center',T0+1.45,null,t);
}
function bgCream(ctx){
  ctx.fillStyle=CREAM; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(540,520,0,540,520,1400); g.addColorStop(0,'rgba(255,252,246,.35)'); g.addColorStop(1,'rgba(255,252,246,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function render(ctx,t){
  if(t>=M0-0.4) bgCream(ctx); else { ctx.fillStyle='#120B07'; ctx.fillRect(0,0,W,H); }
  const last=DISHES.length-1;
  if(t<F0+0.3){
    for(let i=0;i<DISHES.length;i++){
      if(i>0&&t<START[i]-0.5) break;
      if(i<last&&t>=START[i+1]) continue;
      drawDish(ctx,i,t,i===0?1:eInOut(prog(t,START[i]-0.5,START[i])));
    }
    dishTexts(ctx,t); sHook(ctx,t);
  }
  sFire(ctx,t); sMap(ctx,t);
}
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
window.seek=async function(t){ render(ctx,t); };
window.ready=(async()=>{
  await Promise.all([document.fonts.load(`400 80px AirbusSlab`),document.fonts.load(`700 80px "Inter Display"`),document.fonts.load(`500 30px "Inter"`),document.fonts.load(`600 30px "Inter"`),document.fonts.load(`700 30px "Inter"`)]);
  for(const [k,s] of [['airbus','n_airbus_sr.png'],['cta','n_cta.jpg'],['sanduche','n_sanduche.jpg'],['torre','n_torre_sr.png'],['gavilan','n_gavilan_sr.png'],['bebidas','n_bebidas.jpg'],['fire','fire_sr.png'],['mapa','mapa.jpg'],['logo','logo_crop.png']]) IMG[k]=await loadImg('../assets/'+s);
  for(const d of DISHES) BD[d.img]=makeBackdrop(IMG[d.img]);
  await window.seek(parseFloat(new URLSearchParams(location.search).get('t')||'0'));
  return true;
})();
</script>
</body>
</html>
