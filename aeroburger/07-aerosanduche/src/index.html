<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aero Burger — Aerosanduche de pollo</title>
<style>@font-face{font-family:'AirbusSlab';src:url('../assets/Bevan-Regular.ttf')}
html,body{margin:0;background:#EFE8DE;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =========================================================================
   Aero Burger · Producto: AEROSANDUCHE DE POLLO · Reel 1080x1920 @60fps
   Serie de producto (tipografía Bevan) en papel crema como el afiche del Aerosanduche.
   Pasos a velocidad normal con ruta de vuelo; combo; cierre.
   ========================================================================= */
const W=1080, H=1920;
const TEXT='"Inter", sans-serif', DISP='"Inter Display", "Inter", sans-serif', SLAB='"AirbusSlab", serif';
const CREAM='#EFE8DE', INK='#2E2620', SOFT='rgba(46,38,32,.58)', FAINT='rgba(46,38,32,.16)';
const STEPS=[
  {dir:'s1', label:'Pollo desmechado'},
  {dir:'s2', label:'Bien cargado'},
  {dir:'s3', label:'Se cierra el pan'},
  {dir:'s4', label:'Listo para despegar'},
];
const OPEN1=3.0, STEP0=3.0, STEPD=2.0;
const STEP1=STEP0+STEPS.length*STEPD;   // 11.0
// Versión "mesa" (?theme=mesa): sin la foto de estudio; abre con el primer plano de frente y cierra con el combo en la mesa.
const MESA=new URLSearchParams(location.search).get('theme')==='mesa';
const CB0=STEP1, CB1=CB0+1.9, CL1=CB1+1.9;   // combo y primer plano (solo versión estudio)
const END0=MESA?STEP1:CL1;
const DURATION=MESA?17.0:20.5; window.DURATION=DURATION;

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,e)=>a+(b-a)*e;
const eOut=x=>1-Math.pow(1-x,3);
const eOut5=x=>1-Math.pow(1-x,5);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eInOutQ=x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2;
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function cover(ctx,img,x,y,w,h,k=1,ax=0.5,ay=0.5){ const s=Math.max(w/img.width,h/img.height)*k; const dw=img.width*s, dh=img.height*s; ctx.drawImage(img,x+(w-dw)*ax,y+(h-dh)*ay,dw,dh); }
const cache=new Map(); const KEEP=new Set();
function loadImg(src){ if(cache.has(src)) return cache.get(src); const img=new Image(); img.src=src; const p=img.decode().then(()=>img); cache.set(src,p); if(cache.size>30){ const k=cache.keys().next().value; if(!KEEP.has(k)) cache.delete(k);} return p; }
const IMG={};
function stepFrame(t){
  if(t<STEP0-0.35||t>=STEP1+0.4) return null;
  const i=clamp(Math.floor((t-STEP0)/STEPD),0,STEPS.length-1), u=Math.max(0,t-STEP0-i*STEPD);
  return `../frames/${STEPS[i].dir}_90/${String(clamp(Math.floor(u*90)+1,1,180)).padStart(4,'0')}.png`;   // 90 fps: a 1,5x da 60 fps reales
}
function mt(ctx,str,x,y,size,weight,fill,tIn,tOut,t,o={}){   // texto con máscara vertical
  const pIn=eOut5(prog(t,tIn,tIn+(o.inDur||0.5))), pOut=tOut==null?0:eInOut(prog(t,tOut,tOut+0.28));
  if(pIn<=0||pOut>=1) return;
  const lh=size*1.3; ctx.save(); ctx.beginPath(); ctx.rect(0,y-size*1.02,W,lh); ctx.clip();
  ctx.font=`${weight} ${size}px ${o.font||DISP}`; ctx.textAlign=o.align||'center'; ctx.textBaseline='alphabetic';
  if(o.ls!=null) ctx.letterSpacing=o.ls+'px'; ctx.globalAlpha*=clamp(pIn*1.6)*(1-pOut);
  ctx.fillStyle=typeof fill==='function'?fill(ctx,y,size):fill; ctx.fillText(str,x,y+(1-pIn)*lh-pOut*lh); ctx.restore();
}
const graphite=(ctx,y,size)=>{ const cy=y-size*1.6, R=size*3.2; const g=ctx.createRadialGradient(540,cy,0,540,cy,R);
  ['#1A1410','#2E2620','#463A30','#65564A','#837265'].forEach((c,i)=>g.addColorStop([0,0.3,0.52,0.78,1][i],c)); return g; };
function bigWord(ctx,word,cx,y,size,t,tIn,tOut,stagger=0.045){
  ctx.save(); ctx.font=`400 ${size}px ${SLAB}`; ctx.letterSpacing='2px'; const total=ctx.measureText(word).width; ctx.restore();
  let x=cx-total/2;
  for(let i=0;i<word.length;i++){
    ctx.save(); ctx.font=`400 ${size}px ${SLAB}`; ctx.letterSpacing='2px'; const w=ctx.measureText(word[i]).width; ctx.restore();
    mt(ctx,word[i],x,y,size,400,graphite,tIn+i*stagger,tOut==null?null:tOut+i*0.02,t,{align:'left',font:SLAB,ls:2,inDur:0.6});
    x+=w;
  }
}
function plane(ctx,x,y,s,rot,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s); ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(0,0,0.5,0.065,0,0,Math.PI*2); ctx.fill();
  for(const k of [1,-1]){
    ctx.beginPath(); ctx.moveTo(0.12,-0.05*k); ctx.lineTo(-0.12,-0.48*k); ctx.lineTo(-0.24,-0.48*k); ctx.lineTo(-0.12,-0.05*k); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.36,-0.04*k); ctx.lineTo(-0.47,-0.2*k); ctx.lineTo(-0.53,-0.2*k); ctx.lineTo(-0.49,-0.04*k); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function logo(ctx,x,y,r,a=1){ if(a<=0) return; ctx.save(); ctx.globalAlpha*=a; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip(); ctx.drawImage(IMG.logo,x-r,y-r,2*r,2*r); ctx.restore(); }

// ---------- Tarjeta única que cambia de forma y contenido ----------
function cardRect(t){
  const A=MESA?{x:90,y:250,w:900,h:767}:{x:90,y:250,w:900,h:845};     // apertura: primer plano (mesa) o foto del afiche
  const B={x:90,y:300,w:900,h:676};     // pasos (4:3)
  const C={x:90,y:260,w:900,h:775};     // combo (1080:930)
  const D={x:90,y:260,w:900,h:767};     // primer plano (1080:920)
  const E=MESA?{x:140,y:190,w:800,h:689}:{x:215,y:210,w:650,h:610};    // cierre: combo en la mesa o foto del afiche
  const L=(p,q,e)=>({x:lerp(p.x,q.x,e),y:lerp(p.y,q.y,e),w:lerp(p.w,q.w,e),h:lerp(p.h,q.h,e)});
  let r=A;
  r=L(r,B,eInOutQ(prog(t,OPEN1-0.2,OPEN1+0.3)));
  if(!MESA){ r=L(r,C,eInOutQ(prog(t,CB0-0.15,CB0+0.35))); r=L(r,D,eInOutQ(prog(t,CB1-0.15,CB1+0.35))); }
  r=L(r,E,eInOutQ(prog(t,END0-0.1,END0+0.6)));
  const pin=eOut5(prog(t,0,0.8)), s=lerp(0.92,1,pin);
  return {x:r.x+r.w*(1-s)/2, y:r.y+r.h*(1-s)/2+(1-pin)*50, w:r.w*s, h:r.h*s, r:32, a:clamp(pin*1.4)};
}
function drawCard(ctx,t,foot){
  const c=cardRect(t);
  ctx.save(); ctx.globalAlpha=c.a;
  ctx.shadowColor='rgba(46,38,32,.16)'; ctx.shadowBlur=70; ctx.shadowOffsetY=26; rr(ctx,c.x,c.y,c.w,c.h,c.r); ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowColor='transparent';
  rr(ctx,c.x,c.y,c.w,c.h,c.r); ctx.clip();
  const layer=(img,a,k=1,ay=0.5,f='none')=>{ if(a<=0||!img) return; ctx.globalAlpha=c.a*a; ctx.filter=f; cover(ctx,img,c.x,c.y,c.w,c.h,k,0.5,ay); ctx.filter='none'; };
  const NIGHT='saturate(0.82) sepia(0.14) contrast(0.97) brightness(1.03)';   // baja el morado de la luz nocturna
  if(MESA) layer(IMG.close,1,lerp(1.12,1.02,eOut(prog(t,0,3))),0.6,NIGHT); else layer(IMG.hero,1,lerp(1.1,1.0,eOut(prog(t,0,3))));
  if(foot) layer(foot, prog(t,OPEN1-0.15,OPEN1+0.15)*(1-prog(t,(MESA?END0:CB0)-0.15,(MESA?END0:CB0)+0.2)), 1+0.03*clamp((t-STEP0)%STEPD/STEPD));
  if(MESA){ layer(IMG.combo, prog(t,END0-0.15,END0+0.2), lerp(1.12,1.02,eOut(prog(t,END0,DURATION))),0.5,NIGHT); }
  else {
    layer(IMG.combo, prog(t,CB0-0.15,CB0+0.15)*(1-prog(t,CB1-0.15,CB1+0.15)), lerp(1.12,1.02,prog(t,CB0,CB1)),0.5,NIGHT);
    layer(IMG.close, prog(t,CB1-0.15,CB1+0.15)*(1-prog(t,END0+0.05,END0+0.45)), lerp(1.02,1.14,prog(t,CB1,CL1)), 0.6, NIGHT);
    layer(IMG.hero, prog(t,END0+0.05,END0+0.45), 1.0);
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha=c.a; rr(ctx,c.x+.5,c.y+.5,c.w-1,c.h-1,c.r); ctx.strokeStyle='rgba(46,38,32,.10)'; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
}

function bg(ctx){
  ctx.fillStyle=CREAM; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(540,560,0,540,560,1400); g.addColorStop(0,'rgba(255,252,246,.35)'); g.addColorStop(1,'rgba(255,252,246,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function sOpen(ctx,t){
  if(t>OPEN1+0.2) return;
  mt(ctx,'AERO BURGER PRESENTA',540,1185,28,600,SOFT,0.35,2.6,t,{font:TEXT,ls:8});
  bigWord(ctx,'AEROSANDUCHE',540,1325,86,t,0.5,2.65);
  mt(ctx,'de pollo.',540,1425,64,700,INK,1.1,2.75,t,{ls:-1.5});
}
function sSteps(ctx,t){
  if(t<STEP0-0.1||t>STEP1+0.3) return;
  mt(ctx,'ASÍ SE PREPARA',540,1080,26,700,SOFT,STEP0+0.1,STEP1-0.3,t,{font:TEXT,ls:7});
  for(let i=0;i<STEPS.length;i++){
    const a=STEP0+i*STEPD, b=a+STEPD, tin=a+(i===0?0.25:0.05), tout=b-0.3;
    mt(ctx,String(i+1).padStart(2,'0'),540,1215,104,400,graphite,tin,tout,t,{font:SLAB,ls:2});
    mt(ctx,STEPS[i].label,540,1305,64,700,INK,tin+0.08,tout+0.04,t,{ls:-1.5});
  }
  // ruta de vuelo con 4 escalas
  const pa=eOut(prog(t,STEP0+0.2,STEP0+0.6))*(1-eInOut(prog(t,STEP1-0.2,STEP1+0.2)));
  if(pa>0){
    ctx.save(); ctx.globalAlpha=pa;
    const n=STEPS.length, x0=270, x1=810, y=1410, dx=(x1-x0)/(n-1);
    const i=clamp(Math.floor((t-STEP0)/STEPD),0,n-1), u=(t-STEP0)-i*STEPD;
    const pos=i===0?0:(i-1)+eInOutQ(clamp(u/0.7));
    ctx.strokeStyle=FAINT; ctx.lineWidth=2.5; ctx.setLineDash([8,10]); ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x0+dx*pos,y); ctx.stroke();
    for(let k=0;k<n;k++){ const on=pos>=k-0.01; ctx.beginPath(); ctx.arc(x0+k*dx,y,on?9:7,0,Math.PI*2);
      if(on){ ctx.fillStyle=INK; ctx.fill(); } else { ctx.fillStyle=CREAM; ctx.fill(); ctx.strokeStyle='rgba(46,38,32,.45)'; ctx.lineWidth=2; ctx.stroke(); } }
    plane(ctx,x0+dx*pos,y-34,56,0,INK);
    ctx.restore();
  }
}
function sCombo(ctx,t){
  if(MESA) return;
  mt(ctx,'En combo,',540,1170,72,700,INK,CB0+0.3,CB1-0.3,t,{ls:-2});
  mt(ctx,'con papas a la francesa.',540,1250,48,600,SOFT,CB0+0.45,CB1-0.25,t,{font:TEXT});
  mt(ctx,'Cremoso por dentro.',540,1170,72,700,INK,CB1+0.3,END0-0.3,t,{ls:-2});
  mt(ctx,'Pollo desmechado en cada mordida.',540,1250,44,600,SOFT,CB1+0.45,END0-0.25,t,{font:TEXT});
}
function sEnd(ctx,t){
  if(t<END0) return;
  const T0=END0+0.45, DY=MESA?50:0;
  bigWord(ctx,'AEROSANDUCHE',540,975+DY,82,t,T0,null,0.04);
  mt(ctx,MESA?'de pollo, en combo con papas.':'de pollo.',540,1060+DY,MESA?50:60,700,INK,T0+0.35,null,t,{ls:-1.5});
  // pase de abordar sencillo
  const bp=eOut5(prog(t,T0+0.5,T0+1.0));
  if(bp>0){
    ctx.save(); ctx.globalAlpha=bp; ctx.translate(0,(1-bp)*30);
    const x=140,y=1115+DY,w=800,h=136;
    rr(ctx,x,y,w,h,22); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill(); ctx.strokeStyle='rgba(46,38,32,.30)'; ctx.lineWidth=2; ctx.stroke();
    ctx.textAlign='left'; ctx.fillStyle=SOFT; ctx.font=`600 22px ${TEXT}`; ctx.letterSpacing='4px'; ctx.fillText('DESDE',x+40,y+50);
    ctx.textAlign='right'; ctx.fillText('DESTINO',x+w-40,y+50); ctx.letterSpacing='0px';
    ctx.fillStyle=INK; ctx.font=`700 40px ${DISP}`; ctx.textAlign='left'; ctx.fillText('Cocina',x+40,y+102); ctx.textAlign='right'; ctx.fillText('Tu mesa',x+w-40,y+102);
    ctx.strokeStyle='rgba(46,38,32,.35)'; ctx.lineWidth=2; ctx.setLineDash([6,8]); ctx.beginPath(); ctx.moveTo(x+250,y+h/2); ctx.lineTo(x+w-250,y+h/2); ctx.stroke(); ctx.setLineDash([]);
    plane(ctx,lerp(x+260,x+w/2,eInOutQ(prog(t,T0+0.7,T0+1.6))),y+h/2,64,0,INK);
    ctx.restore();
  }
  mt(ctx,'Ven al local o pide domicilio en Santa Elena.',540,1330+DY,32,500,SOFT,T0+0.8,null,t,{font:TEXT});
  const q=eOut(prog(t,T0+1.0,T0+1.5));
  if(q>0){
    ctx.save(); ctx.globalAlpha=q; ctx.translate(0,(1-q)*20);
    ctx.font=`600 36px ${TEXT}`; const s='@aero.burger'; const w=ctx.measureText(s).width; const L=66; const x0=540-(w+L+20)/2;
    logo(ctx,x0+L/2,1430+DY,L/2,1); ctx.fillStyle=INK; ctx.textAlign='left'; ctx.fillText(s,x0+L+20,1442+DY);
    ctx.restore();
  }
}
function render(ctx,t,foot){ bg(ctx); drawCard(ctx,t,foot); sOpen(ctx,t); sSteps(ctx,t); sCombo(ctx,t); sEnd(ctx,t); }
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
const accC=document.createElement('canvas'); accC.width=W; accC.height=H; const actx=accC.getContext('2d');
const BLUR=[[0,0.8],[OPEN1-0.2,OPEN1+0.3],[CB0-0.15,CB0+0.35],[CB1-0.15,CB1+0.35],[END0-0.1,END0+0.6]];
const inBlur=t=>BLUR.some(([a,b])=>t>a-0.02&&t<b+0.02);
window.seek=async function(t){
  const times=inBlur(t)?Array.from({length:5},(_,i)=>t+(i/4-0.5)*0.32/60):[t];
  const imgs=await Promise.all(times.map(async tt=>{ const s=stepFrame(tt)||(tt>OPEN1-0.35&&tt<STEP0?'../frames/s1_90/0001.png':null); return s?await loadImg(s):null; }));
  if(times.length===1){ render(ctx,t,imgs[0]); return; }
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<times.length;i++){ render(actx,Math.max(0,times[i]),imgs[i]); ctx.globalAlpha=1/(i+1); ctx.drawImage(accC,0,0); ctx.globalAlpha=1; }
};
window.ready=(async()=>{
  await Promise.all([document.fonts.load(`400 80px AirbusSlab`),document.fonts.load(`700 80px "Inter Display"`),document.fonts.load(`500 30px "Inter"`),document.fonts.load(`600 30px "Inter"`),document.fonts.load(`700 30px "Inter"`)]);
  for(const [k,s] of [['hero','hero.jpg'],['combo','combo_top.jpg'],['close','combo_close.jpg'],['logo','logo_crop.png']]){ KEEP.add('../assets/'+s); IMG[k]=await loadImg('../assets/'+s); }
  await window.seek(parseFloat(new URLSearchParams(location.search).get('t')||'0'));
  return true;
})();
</script>
</body>
</html>
