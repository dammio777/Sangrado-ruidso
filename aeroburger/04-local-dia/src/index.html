<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aero Burger — De día</title>
<style>@font-face{font-family:'AirbusSlab';src:url('../assets/fonts/Bevan-Regular.ttf')}
html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =========================================================================
   Aero Burger · El local de día · Reel 1080x1920 @60fps
   Minimal tipo galería: fondo blanco, cada toma como una foto numerada.
   Animación determinista: window.seek(t).
   ========================================================================= */
const W=1080, H=1920;
const TEXT='"Inter", sans-serif', DISP='"Inter Display", "Inter", sans-serif', SLAB='"AirbusSlab", serif';
const CLIPS=[
  {dir:'c1', n:115, label:'La llegada'},
  {dir:'c2', n:133, label:'Bajo la carpa'},
  {dir:'c3', n:145, label:'El corredor'},
  {dir:'c4', n:87,  label:'Cada rincón'},
  {dir:'c5', n:136, label:'La luna'},
  {dir:'c6', n:114, label:'Alma de piloto'},
  {dir:'c7', n:68,  label:'La barra'},
  {dir:'c8', n:147, label:'Tu mesa'},
];
const START=2.4;
let acc=START; for(const c of CLIPS){ c.start=acc; c.dur=c.n/60; acc+=c.dur; c.end=acc; }
const CEND=acc;                 // ~18.1
const DURATION=Math.ceil((CEND+3.4)*10)/10; window.DURATION=DURATION;
const CARD={x:90,y:300,w:900,h:1260,r:28};

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,e)=>a+(b-a)*e;
const eOut=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const cache=new Map(); const KEEP=new Set();
function loadImg(src){ if(cache.has(src)) return cache.get(src); const img=new Image(); img.src=src; const p=img.decode().then(()=>img); cache.set(src,p); if(cache.size>30){ const k=cache.keys().next().value; if(!KEEP.has(k)) cache.delete(k);} return p; }
const IMG={};

function clipAt(t){ if(t<START-0.3) return null; return CLIPS.find(c=>t<c.end) || CLIPS[CLIPS.length-1]; }
function footageSrc(t){
  const c=clipAt(t); if(!c) return null;
  const idx=clamp(Math.floor((t-c.start)*60)+1,1,c.n);
  return `../frames/${c.dir}/${String(idx).padStart(4,'0')}.png`;
}
// texto que aparece con un pequeño desplazamiento y se va igual
function txt(ctx,str,x,y,font,col,align,tIn,tOut,t,o={}){
  const a=eOut(prog(t,tIn,tIn+(o.d||0.35)))*(tOut==null?1:1-eInOut(prog(t,tOut,tOut+(o.d||0.25))));
  if(a<=0) return;
  ctx.save(); ctx.globalAlpha*=a; ctx.font=font; ctx.textAlign=align; ctx.fillStyle=col;
  if(o.ls) ctx.letterSpacing=o.ls+'px';
  ctx.fillText(str,x,y+(1-a)*(o.dy??14)); ctx.restore();
}
const graphite=(ctx,y,size)=>{ const cy=y-size*1.6, R=size*3.0; const g=ctx.createRadialGradient(540,cy,0,540,cy,R);
  ['#000000','#141414','#333333','#575757','#767676'].forEach((c,i)=>g.addColorStop([0,0.3,0.52,0.78,1][i],c)); return g; };
function logo(ctx,x,y,r,a=1){ ctx.save(); ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip(); ctx.drawImage(IMG.logo,x-r/0.985,y-r/0.985,2*r/0.985,2*r/0.985); ctx.restore(); }

function sIntro(ctx,t){
  if(t>START+0.2) return;
  const out=1-eInOut(prog(t,START-0.35,START-0.05));
  const p=eOut(prog(t,0.1,0.8));
  logo(ctx,540,760,lerp(100,120,p),p*out);
  ctx.save(); ctx.globalAlpha=out;
  txt(ctx,'AERO BURGER',540,1040,`400 104px ${SLAB}`,graphite(ctx,1040,104),'center',0.45,null,t,{ls:3});
  txt(ctx,'de día.',540,1120,`500 50px ${TEXT}`,'#7a7a7a','center',0.8,null,t);
  ctx.restore();
}
function sGallery(ctx,t,img){
  if(t<START-0.3 || t>CEND+0.4) return;
  const a=eOut(prog(t,START-0.3,START+0.05))*(1-eInOut(prog(t,CEND-0.05,CEND+0.3)));
  if(a<=0) return;
  const s=lerp(0.97,1,eOut(prog(t,START-0.3,START+0.2)));
  const cx=CARD.x+CARD.w/2, cy=CARD.y+CARD.h/2;
  ctx.save(); ctx.globalAlpha=a; ctx.translate(cx,cy); ctx.scale(s,s); ctx.translate(-cx,-cy);
  ctx.shadowColor='rgba(0,0,0,.10)'; ctx.shadowBlur=50; ctx.shadowOffsetY=18; rr(ctx,CARD.x,CARD.y,CARD.w,CARD.h,CARD.r); ctx.fillStyle='#eee'; ctx.fill(); ctx.shadowColor='transparent';
  rr(ctx,CARD.x,CARD.y,CARD.w,CARD.h,CARD.r); ctx.clip();
  if(img) ctx.drawImage(img,CARD.x,CARD.y,CARD.w,CARD.h);
  ctx.restore();
  // etiquetas tipo galería
  ctx.save(); ctx.globalAlpha=a;
  for(let i=0;i<CLIPS.length;i++){
    const c=CLIPS[i]; const tin=c.start-(i===0?0:0.02), tout=i===CLIPS.length-1?null:c.end-0.2;
    txt(ctx,String(i+1).padStart(2,'0'),CARD.x,262,`600 30px ${TEXT}`,'#000','left',tin,tout,t,{d:0.25,dy:10});
    txt(ctx,c.label,CARD.x+58,262,`600 30px ${TEXT}`,'#000','left',tin+0.04,tout,t,{d:0.25,dy:10});
  }
  txt(ctx,'Santa Elena',CARD.x+CARD.w,262,`500 30px ${TEXT}`,'#9a9a9a','right',START-0.2,null,t);
  // línea de progreso finita bajo la tarjeta
  const P=clamp((t-START)/(CEND-START));
  ctx.fillStyle='rgba(0,0,0,.10)'; ctx.fillRect(CARD.x,CARD.y+CARD.h+40,CARD.w,2);
  ctx.fillStyle='#000'; ctx.fillRect(CARD.x,CARD.y+CARD.h+40,CARD.w*P,2);
  txt(ctx,'AERO BURGER  ·  DE DÍA',540,CARD.y+CARD.h+92,`600 22px ${TEXT}`,'#9a9a9a','center',START,null,t,{ls:5});
  ctx.restore();
}
function sOutro(ctx,t){
  if(t<CEND) return;
  const T0=CEND+0.25;
  const p=eOut(prog(t,T0,T0+0.6)); logo(ctx,540,740,lerp(96,110,p),p);
  txt(ctx,'Te esperamos.',540,1010,`700 80px ${DISP}`,'#000','center',T0+0.25,null,t,{ls:-2});
  txt(ctx,'Aero Burger  ·  Santa Elena',540,1080,`500 38px ${TEXT}`,'#7a7a7a','center',T0+0.4,null,t);
  txt(ctx,'Somos petfriendly.',540,1132,`500 34px ${TEXT}`,'#9a9a9a','center',T0+0.5,null,t);
  txt(ctx,'@aero.burger',540,1250,`600 38px ${TEXT}`,'#000','center',T0+0.7,null,t);
}
function render(ctx,t,img){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  sIntro(ctx,t); sGallery(ctx,t,img); sOutro(ctx,t);
}
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
window.seek=async function(t){ const s=footageSrc(t); render(ctx,t,s?await loadImg(s):null); };
window.ready=(async()=>{
  await Promise.all([document.fonts.load(`400 80px AirbusSlab`),document.fonts.load(`700 80px "Inter Display"`),document.fonts.load(`500 30px "Inter"`),document.fonts.load(`600 30px "Inter"`)]);
  KEEP.add('../assets/logo_crop.png'); IMG.logo=await loadImg('../assets/logo_crop.png');
  await window.seek(parseFloat(new URLSearchParams(location.search).get('t')||'0'));
  return true;
})();
</script>
</body>
</html>
