<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aero Burger — POV</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =========================================================================
   Aero Burger · "POV" · Reel 1080x1920 @60fps
   Historia en primera persona con video real a pantalla completa y textos estilo Instagram.
   Cortes sobre los tiempos de la música (120 BPM).
   ========================================================================= */
const W=1080, H=1920;
const CAP='600 46px "Inter", "Noto Color Emoji", sans-serif';
const NIGHT='saturate(0.9) sepia(0.08) contrast(0.98) brightness(1.03)';
// type: 'seq' (carpeta de cuadros a 60 fps) o 'img' (foto con movimiento lento)
const SHOTS=[
  {t:0.0,  type:'seq', dir:'../../01-local/frames/c1', n:126, off:0,  cap:'pov: tienes hambre en Santa Elena'},
  {t:2.0,  type:'seq', dir:'../../01-local/frames/c2', n:162, off:20, cap:'y alguien dice: "vamos a Aero Burger"'},
  {t:3.5,  type:'seq', dir:'../../01-local/frames/c4', n:186, off:30, cap:'llegas y ya te gustó el lugar'},
  {t:5.0,  type:'img', img:'fire',   k:[1.14,1.04], ax:[0.5,0.5], ay:0.5, f:'brightness(1.05)', cap:'hace frío… pero hay chimenea 🔥'},
  {t:6.5,  type:'seq', dir:'../../07-aerosanduche/frames/n1', n:120, off:0, png:true, cap:'pides el Aerosanduche'},
  {t:8.5,  type:'seq', dir:'../../07-aerosanduche/frames/n2', n:120, off:10, png:true, cap:'y lo cargan así'},
  {t:10.0, type:'seq', dir:'../../07-aerosanduche/frames/n4', n:120, off:0, png:true, cap:'lo cierran…'},
  {t:11.5, type:'img', img:'combo',  k:[1.06,1.0], ax:[0.08,0.45], ay:0.5, f:NIGHT, cap:'llega con papas'},
  {t:13.0, type:'img', img:'drinks', k:[1.0,1.06], ax:[0.5,0.55], ay:0.5, f:NIGHT, cap:'y algo pa\' tomar'},
  {t:14.5, type:'img', img:'close',  k:[1.02,1.12], ax:[0.42,0.46], ay:0.55, f:NIGHT, cap:'y tú: 🤤'},
];
const END0=16.5, DURATION=19.0; window.DURATION=DURATION;
SHOTS.forEach((s,i)=>s.end=(i<SHOTS.length-1?SHOTS[i+1].t:END0));

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,e)=>a+(b-a)*e;
const eOut=x=>1-Math.pow(1-x,3);
const eOutBack=x=>{ const c=1.4; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function cover(ctx,img,k=1,ax=0.5,ay=0.5){ const s=Math.max(W/img.width,H/img.height)*k; const dw=img.width*s, dh=img.height*s; ctx.drawImage(img,(W-dw)*ax,(H-dh)*ay,dw,dh); }
const cache=new Map(); const KEEP=new Set();
function loadImg(src){ if(cache.has(src)) return cache.get(src); const img=new Image(); img.src=src; const p=img.decode().then(()=>img); cache.set(src,p); if(cache.size>30){ const k=cache.keys().next().value; if(!KEEP.has(k)) cache.delete(k);} return p; }
const IMG={};

const shotAt=t=>{ let s=SHOTS[0]; for(const x of SHOTS) if(t>=x.t) s=x; return s; };
function frameSrc(t){
  const s=shotAt(Math.min(t,END0-0.001)); if(s.type!=='seq') return null;
  const idx=clamp(s.off+Math.floor((t-s.t)*60)+1,1,s.n);
  return `${s.dir}/${String(idx).padStart(4,'0')}.${s.png?'png':'jpg'}`;
}
// texto estilo Instagram: caja blanca redondeada con texto negro, entra con un pequeño "pop"
function caption(ctx,str,t,t0,t1){
  const pin=prog(t,t0+0.05,t0+0.25), pout=prog(t,t1-0.12,t1);
  if(pin<=0||pout>=1) return;
  ctx.save(); ctx.font=CAP; ctx.letterSpacing='-0.5px';
  const w=ctx.measureText(str).width+56, h=78, x=540-w/2, y=1150;
  const s=lerp(0.88,1,eOutBack(pin));
  ctx.globalAlpha=clamp(pin*2)*(1-pout);
  ctx.translate(540,y+h/2); ctx.scale(s,s); ctx.translate(-540,-(y+h/2));
  ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=20; ctx.shadowOffsetY=4;
  rr(ctx,x,y,w,h,18); ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowColor='transparent';
  ctx.fillStyle='#111'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(str,540,y+h/2+2);
  ctx.restore();
}
function render(ctx,t,frame){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const s=shotAt(Math.min(t,END0-0.001)), u=prog(t,s.t,s.end);
  if(s.type==='seq' && frame){ cover(ctx,frame,1+0.03*u,0.5,0.5); }
  else if(s.type==='img'){ ctx.filter=s.f; cover(ctx,IMG[s.img],lerp(s.k[0],s.k[1],u),lerp(s.ax[0],s.ax[1],eInOut(u)),s.ay); ctx.filter='none'; }
  // al final, la última toma sigue debajo, oscurecida, con la firma
  if(t>=END0){ ctx.filter=NIGHT; cover(ctx,IMG.close,lerp(1.12,1.18,prog(t,END0,DURATION)),0.46,0.55); ctx.filter='none'; }
  const d=eInOut(prog(t,END0-0.1,END0+0.5)); if(d>0){ ctx.fillStyle=`rgba(8,5,3,${0.62*d})`; ctx.fillRect(0,0,W,H); }
  for(const sh of SHOTS) caption(ctx,sh.cap,t,sh.t,sh.end);
  if(t>=END0){
    const a=eOut(prog(t,END0+0.2,END0+0.8));
    ctx.save(); ctx.globalAlpha=a; ctx.translate(0,(1-a)*20);
    ctx.beginPath(); ctx.arc(540,820,92,0,Math.PI*2); ctx.clip(); ctx.drawImage(IMG.logo,448,728,184,184); ctx.restore();
    const txt=(s,y,font,col,t0)=>{ const b=eOut(prog(t,t0,t0+0.45)); if(b<=0) return; ctx.save(); ctx.globalAlpha=b; ctx.font=font; ctx.fillStyle=col; ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=16; ctx.fillText(s,540,y+(1-b)*12); ctx.restore(); };
    txt('Aero Burger',1010,'700 72px "Inter Display", "Inter"','#fff',END0+0.35);
    txt('Santa Elena  ·  Somos petfriendly',1075,'500 36px "Inter"','rgba(255,255,255,.82)',END0+0.5);
    txt('Ven al local o pide domicilio en Santa Elena.',1130,'500 34px "Inter"','rgba(255,255,255,.82)',END0+0.6);
    txt('@aero.burger',1215,'700 40px "Inter"','#fff',END0+0.75);
  }
}
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
window.seek=async function(t){ const s=frameSrc(t); render(ctx,t,s?await loadImg(s):null); };
window.ready=(async()=>{
  await Promise.all([document.fonts.load(`600 46px "Inter"`),document.fonts.load(`700 72px "Inter Display"`),document.fonts.load(`500 30px "Inter"`),document.fonts.load(`700 30px "Inter"`)]);
  for(const [k,s] of [['fire','../../06-nuevo/assets/fire_sr.png'],['combo','../../07-aerosanduche/assets/combo_top_sr.png'],['close','../../07-aerosanduche/assets/combo_close_sr.png'],['drinks','../../06-nuevo/assets/n_bebidas.jpg'],['logo','../assets/logo_crop.png']]){ KEEP.add(s); IMG[k]=await loadImg(s); }
  await window.seek(parseFloat(new URLSearchParams(location.search).get('t')||'0'));
  return true;
})();
</script>
</body>
</html>
