<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casa Amiga</title>
    <style>
      html, body { margin: 0; background: #120c09; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      #c { width: 1080px; height: 1920px; display: block; }
      body.preview #c { height: calc(100vh - 56px); width: auto; aspect-ratio: 9 / 16; margin: 0 auto; }
      #ui { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 56px; align-items: center; gap: 12px; padding: 0 16px; background: #1d1410; color: #f6efe6; }
      #ui input { flex: 1; } #ui button { background: #f28c1e; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1080" height="1920"></canvas>
    <div id="ui"><button id="play">▶︎</button><input id="t" type="range" min="0" value="0" /><span id="lab"></span></div>
    <script>if (!location.search.includes('mode=draft') && !location.search.includes('mode=final')) document.body.classList.add('preview');</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
