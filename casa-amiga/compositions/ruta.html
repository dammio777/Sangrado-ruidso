  <script>
  (function () {
    /*CONFIG:BEGIN*/
    const CONFIG = {"footage":18,"clips":[{"start":0,"dur":6,"hito":2,"texto_en":0.35},{"start":6,"dur":6,"hito":5,"texto_en":0.35},{"start":12,"dur":6,"hito":6,"texto_en":2.2}],"hitos":[{"n":1,"nombre":"El Silletero","pos":0},{"n":2,"nombre":"Finca silletera Óscar Londoño","pos":0.19},{"n":3,"nombre":"Panchocha Santa Elena","pos":0.38},{"n":4,"nombre":"Restaurante Artesano","pos":0.56},{"n":5,"nombre":"La Samaria","pos":0.76},{"n":6,"nombre":"Casa Amiga · Vereda El Placer","pos":1}]};
    
/*CONFIG:END*/
    const R = document.querySelector('[data-composition-id="ruta"]');
    const $ = (id) => R.querySelector('#' + id);
    const NS = 'http://www.w3.org/2000/svg';
    const F = CONFIG.footage, CL = CONFIG.clips;
    R.setAttribute('data-duration', String(F));
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const seg = (t, a, b) => clamp((t - a) / (b - a));
    const lerp = (a, b, u) => a + (b - a) * u;
    const ios = (u) => -(Math.cos(Math.PI * u) - 1) / 2;

    const PIN = '<path d="M65 163 C65 163 9 101 9 62 A56 56 0 1 1 121 62 C121 101 65 163 65 163Z" fill="#F29021"/><circle cx="65" cy="62" r="45" fill="#FFF8EF"/><image href="assets/img/icono.png" x="27" y="25" width="76" height="71"/>';
    R.querySelectorAll('svg.pin').forEach((s) => { s.innerHTML = PIN; });
    $('r-headSub').textContent = 'VIDEO · ' + CL.length + (CL.length === 1 ? ' TRAMO' : ' TRAMOS');

    // segmentos del encabezado
    const segs = $('r-segs'); CL.forEach(() => { const d = document.createElement('div'); d.className = 'sg'; d.innerHTML = '<i></i>'; segs.appendChild(d); });
    const segFill = [...segs.querySelectorAll('i')];

    // mini-mapa (misma vía que el mapa dibujado)
    function catmull(pts, n = 16) { const out = []; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)]; for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t; out.push([0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3), 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } } out.push(pts[pts.length - 1]); return out; }
    const routePts = [[470, 1580], [600, 1480], [610, 1360], [420, 1270], [360, 1150], [520, 1050], [620, 930], [520, 820], [390, 720], [440, 600], [610, 500], [620, 400], [520, 320], [540, 232]];
    const pl = catmull(routePts, 20); const L = [0]; for (let i = 1; i < pl.length; i++) L.push(L[i - 1] + Math.hypot(pl[i][0] - pl[i - 1][0], pl[i][1] - pl[i - 1][1]));
    const tot = L[L.length - 1];
    const pointAt = (f) => { const d = clamp(f) * tot; let i = 1; while (i < L.length - 1 && L[i] < d) i++; const a = pl[i - 1], b = pl[i]; const u = (d - L[i - 1]) / Math.max(1e-6, L[i] - L[i - 1]); return [lerp(a[0], b[0], u), lerp(a[1], b[1], u)]; };
    const ms = 0.215, mx = (x) => 150 + (x - 505) * ms, my = (y) => 8 + (y - 220) * ms;
    const mini = $('r-miniSvg');
    const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); mini.appendChild(e); return e; };
    const dM = 'M' + pl.map((p) => mx(p[0]).toFixed(1) + ' ' + my(p[1]).toFixed(1)).join(' L');
    mk('path', { d: dM, fill: 'none', stroke: '#2B1D17', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    mk('path', { d: dM, fill: 'none', stroke: '#FBF5EA', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const miniRoute = mk('path', { d: dM, fill: 'none', stroke: '#F29021', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1000, 'stroke-dasharray': '1000 1400', 'stroke-dashoffset': 1000 });
    CONFIG.hitos.forEach((h, i) => { const [x, y] = pointAt(h.pos); const last = i === CONFIG.hitos.length - 1; mk('circle', { cx: mx(x), cy: my(y), r: last ? 9 : 7, fill: last ? '#F29021' : '#FBF5EA', stroke: '#2B1D17', 'stroke-width': 2.5 }); });
    const dot = mk('circle', { r: 11, fill: '#F29021', stroke: '#fff', 'stroke-width': 4 });
    const hitoPos = (n) => { const h = CONFIG.hitos.find((x) => x.n === n); return h ? h.pos : 0; };
    // posición del puntito: avanza del hito anterior al hito de cada clip mientras el clip corre
    function dotPos(t) { let from = 0; for (let k = 0; k < CL.length; k++) { const c = CL[k], to = hitoPos(c.hito); if (t < c.start + c.dur || k === CL.length - 1) { return lerp(from, to, ios(seg(t, c.start, c.start + c.dur))); } from = to; } return 1; }

    const phBars = [...R.querySelectorAll('.ph .bar i')];
    const phDash = [...R.querySelectorAll('.ph .dash')];
    function render(t) {
      const p = dotPos(t); const [x, y] = pointAt(p);
      dot.setAttribute('cx', mx(x).toFixed(2)); dot.setAttribute('cy', my(y).toFixed(2));
      miniRoute.setAttribute('stroke-dashoffset', (1000 * (1 - p)).toFixed(2));
      CL.forEach((c, k) => { if (segFill[k]) segFill[k].style.transform = `scaleX(${seg(t, c.start, c.start + c.dur).toFixed(4)})`; });
      // tarjetas de reemplazo: barra de progreso y carretera en movimiento
      CL.forEach((c, k) => { const u = seg(t, c.start, c.start + c.dur); R.querySelectorAll('#r-slot' + k + ' .bar i').forEach((b) => { b.style.transform = `scaleX(${u.toFixed(4)})`; }); R.querySelectorAll('#r-slot' + k + ' .dash').forEach((d) => { d.setAttribute('stroke-dashoffset', (-(t - c.start) * 260).toFixed(1)); }); });
    }

    const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
    const POP = { x: 240, y: 652, s: 600 / 1080 };
    // 0–0.9 la ventana emergente se abre desde «Iniciar» y crece a pantalla completa
    tl.fromTo('#r-dim', { opacity: 0 }, { opacity: 1, duration: .25, ease: 'power1.out' }, 0);
    tl.fromTo('#r-frame', { x: POP.x, y: POP.y, scale: POP.s, opacity: 0, clipPath: 'inset(0px round 0px 0px 72px 72px)', yPercent: 0 },
      { opacity: 1, duration: .1 }, 0);
    tl.fromTo('#r-head', { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: .38, ease: 'expo.out' }, 0);
    tl.fromTo('#r-iris', { scale: .3, transformOrigin: '418px 1724px', opacity: 0 }, { scale: 1, opacity: 1, duration: .38, ease: 'expo.out' }, 0);
    tl.to('#r-frame', { x: 0, y: 0, scale: 1, clipPath: 'inset(0px round 0px 0px 0px 0px)', duration: .52, ease: 'power3.inOut' }, .38);
    tl.to('#r-head', { y: -260, opacity: 0, filter: 'blur(6px)', duration: .3, ease: 'power3.in' }, .38);
    tl.to('#r-dim', { opacity: 0, duration: .3 }, .6);
    // capas sobre el video
    tl.fromTo('#r-pill', { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: 'expo.out' }, .88);
    tl.fromTo('#r-mini', { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: .5, ease: 'expo.out' }, 1.0);
    // cortes entre clips: barrido enmascarado con borde naranja
    CL.forEach((c, k) => {
      if (k > 0) {
        tl.fromTo('#r-slot' + k, { clipPath: 'inset(0px 0px 0px 100%)' }, { clipPath: 'inset(0px 0px 0px 0%)', duration: .36, ease: 'power3.inOut' }, c.start);
        tl.fromTo('#r-wipe', { x: 1080, opacity: 1 }, { x: -10, duration: .36, ease: 'power3.inOut' }, c.start);
        tl.set('#r-wipe', { opacity: 0 }, c.start + .37);
      }
      const at = Math.max(k === 0 ? 1.05 : c.start + .1, c.start + (c.texto_en ?? .35));
      const hold = Math.min(2.0, Math.max(.9, c.start + c.dur - at - 0.5 - (k === CL.length - 1 ? 0.9 : 0)));
      tl.fromTo('#r-cap' + k, { x: -50, opacity: 0, filter: 'blur(6px)' }, { x: 0, opacity: 1, filter: 'blur(0px)', duration: .42, ease: 'expo.out' }, at);
      tl.to('#r-cap' + k, { x: -30, opacity: 0, filter: 'blur(6px)', duration: .22, ease: 'power2.in' }, at + .42 + hold);
    });
    // contracción final hacia el teléfono y cierre en iris sobre el pin
    const K = F - 0.9;
    tl.to(['#r-pill', '#r-mini'], { opacity: 0, y: -20, duration: .2, ease: 'power2.in' }, K - .25);
    tl.to('#r-frame', { x: POP.x, y: POP.y, scale: POP.s, clipPath: 'inset(0px round 72px 72px 72px 72px)', duration: .48, ease: 'power3.inOut' }, K);
    tl.fromTo('#r-iris', { clipPath: 'circle(1500px at 540px 783px)' }, { clipPath: 'circle(0px at 540px 783px)', duration: .42, ease: 'power3.in', immediateRender: false }, K + .46);
    tl.set('#r-frame', { opacity: 0 }, F - 0.01);
    tl.set({}, {}, F);
    render(0);
    window.__timelines['ruta'] = tl;
  })();
  </script>
