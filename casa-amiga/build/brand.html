<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de video "Marca en Casa Amiga". Uso: brand.html?b=<id>  (configuración en brands/<id>.js) -->
<link rel="stylesheet" href="assets/local.css">
<link rel="stylesheet" href="assets/fonts-marcas.css">
<script>document.write('<script src="brands/'+(new URLSearchParams(location.search).get('b')||'montana')+'.js"><\/script>')</script>
<style>
:root{--ca:#F29021;--caInk:#4A1F0E;--caTxt:#C4570E;--caBg:#FFF3E0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--caBg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--caBg);font-family:Inter,sans-serif}
.layer{position:absolute;inset:0;overflow:hidden;display:none}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:.2em 4px 0;margin-top:-.2em}
.ch{display:inline-block}
.bh{font-family:var(--bHead);line-height:.98}
.bb{font-family:var(--bBody)}
.bm{font-family:var(--bMono);text-transform:uppercase;letter-spacing:.18em}
#grain{position:absolute;inset:-200px;background:url(assets/grain.png);opacity:.09;mix-blend-mode:overlay;pointer-events:none;z-index:60}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 60%,rgba(0,0,0,.18) 100%);z-index:59;pointer-events:none}
/* badge Casa Amiga */
#badge{position:absolute;left:50%;top:150px;z-index:55;display:flex;align-items:center;gap:16px;transform:translateX(-50%);padding:10px 26px 10px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);white-space:nowrap;opacity:0}
#badge img{width:84px;height:84px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
#badge span{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:21px;font-weight:700}
/* A: intro Casa Amiga */
#A .logo{position:absolute;left:50%;top:560px;width:420px;height:420px;margin-left:-210px}
#A .logo img{width:100%;height:100%;filter:drop-shadow(0 26px 46px rgba(122,46,23,.35))}
#A .t1{position:absolute;left:0;right:0;top:1070px;text-align:center;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.3em;font-size:28px;color:var(--caTxt)}
#A .t2{position:absolute;left:0;right:0;top:1120px;text-align:center;font-family:'Great Vibes',cursive;font-size:150px;color:var(--caInk)}
#A .t3{position:absolute;left:0;right:0;top:1330px;text-align:center;font-family:Anton,sans-serif;text-transform:uppercase;font-size:62px;color:var(--ca);letter-spacing:1px}
#wipe{position:absolute;inset:0;background:var(--bA);z-index:50;clip-path:circle(0px at 50% 40%)}
/* B: presentación de la marca */
#B{background:var(--bA)}
#B svg.ridges{position:absolute;left:-100px;top:0;width:1280px;height:1920px}
#B .blogo{position:absolute;left:50%;top:430px;width:600px;height:600px;margin-left:-300px;border-radius:50%;box-shadow:0 40px 90px rgba(0,0,0,.45),0 0 0 10px rgba(255,255,255,.08)}
#B .blogo img{width:100%;height:100%}
#B .name{position:absolute;left:0;right:0;top:1110px;text-align:center;color:var(--bCream);font-size:104px;text-transform:uppercase}
#B .handle{position:absolute;left:0;right:0;top:1360px;text-align:center;color:var(--bB2);font-size:30px}
#B .tag{position:absolute;left:0;right:0;top:1420px;text-align:center;color:var(--bCream);font-size:44px;font-style:italic;opacity:.95}
/* C: viajes / postales */
#C{background:var(--bPaper)}
#C .head{position:absolute;left:80px;right:80px;top:300px}
#C .head .h1{font-size:96px;color:var(--bHeadC);text-transform:uppercase}
#C .head .h2{font-size:52px;color:var(--bB);font-style:italic;margin-top:10px}
#C svg.route{position:absolute;inset:0;width:1080px;height:1920px}
.pc{position:absolute;background:#fffdf6;padding:20px 20px 70px;box-shadow:0 26px 60px rgba(30,40,40,.35);border-radius:6px}
.pc .ph{width:100%;height:100%;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pc .cap{position:absolute;left:24px;right:24px;bottom:18px;font-family:var(--bMono);font-size:26px;color:var(--bInk);opacity:.8}
.stamp{position:absolute;width:230px;height:230px;border-radius:50%;border:6px solid var(--bB);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--bB);font-family:var(--bMono);text-transform:uppercase;text-align:center;line-height:1.1;mix-blend-mode:multiply}
.stamp:before{content:'';position:absolute;inset:10px;border-radius:50%;border:2px dashed var(--bB)}
.stamp b{font-size:32px;font-weight:400}
.stamp i{font-style:normal;font-size:20px;letter-spacing:.2em;margin-top:6px}
/* D: producto */
#D{background:var(--bA)}
#D .head{position:absolute;left:80px;right:80px;top:300px;color:var(--bCream)}
#D .head .h1{font-size:104px;text-transform:uppercase}
#D .head .h2{font-size:50px;font-style:italic;color:var(--bB2);margin-top:12px}
#D .big{position:absolute;left:80px;top:640px;width:640px;height:860px;border-radius:40px;overflow:hidden;box-shadow:0 34px 80px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.2)}
#D .small{position:absolute;right:70px;top:1080px;width:380px;height:500px;border-radius:30px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);border:8px solid var(--bCream)}
#D .big img,#D .small img{width:100%;height:100%;object-fit:cover;filter:brightness(1.15) saturate(1.08)}
#D .chips{position:absolute;right:70px;top:660px;display:flex;flex-direction:column;align-items:flex-end;gap:18px}
#D .chips div{padding:14px 26px;border-radius:999px;background:var(--bCream);color:var(--bA);font-family:var(--bMono);font-size:24px;text-transform:uppercase;letter-spacing:.1em;box-shadow:0 10px 26px rgba(0,0,0,.3);white-space:nowrap}
/* E: cierre Casa Amiga */
#E{background:var(--caBg)}
#E .k{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:Anton,sans-serif;text-transform:uppercase;font-size:118px;color:var(--caInk)}
#E .duo{position:absolute;left:0;right:0;top:500px;height:420px}
#E .duo .l1{position:absolute;left:110px;top:30px;width:360px;height:360px;border-radius:50%;box-shadow:0 26px 60px rgba(0,0,0,.3)}
#E .duo .l2{position:absolute;right:110px;top:20px;width:380px;height:380px;filter:drop-shadow(0 26px 46px rgba(122,46,23,.35))}
#E .duo .x{position:absolute;left:0;right:0;top:150px;text-align:center;font-family:'Great Vibes',cursive;font-size:120px;color:var(--caTxt)}
#E .ca{position:absolute;left:0;right:0;top:930px;text-align:center;font-family:'Great Vibes',cursive;font-size:150px;color:var(--caInk)}
#E .loc{position:absolute;left:0;right:0;top:1130px;text-align:center;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.3em;font-size:26px;color:var(--caTxt)}
#E .card{position:absolute;left:90px;right:90px;top:1220px;border-radius:44px;padding:36px;text-align:center;background:rgba(255,255,255,.7);border:1.5px solid rgba(122,46,23,.12);box-shadow:0 18px 50px rgba(122,46,23,.18)}
#E .url{display:inline-block;border-radius:999px;padding:24px 40px;font-size:36px;font-weight:800;background:var(--ca);color:#fff;white-space:nowrap}
#E .hs{margin-top:24px;font-size:28px;font-weight:600;color:var(--caInk)}
#E .hs span{color:var(--caTxt)}
</style></head><body>
<div id="stage">
  <div class="layer" id="A">
    <div class="logo" id="Alogo"><img src="assets/logo-circulo.png"></div>
    <div class="t1" id="At1">Marcas que encuentras en</div>
    <div class="t2" id="At2">Casa Amiga</div>
    <div class="t3" id="At3"></div>
  </div>
  <div class="layer" id="B">
    <svg class="ridges" id="ridges" viewBox="0 0 1280 1920"></svg>
    <div class="blogo" id="Blogo"><img id="BlogoImg"></div>
    <div class="name bh" id="Bname"></div>
    <div class="handle bm" id="Bhandle"></div>
    <div class="tag bb" id="Btag"></div>
  </div>
  <div class="layer" id="C">
    <svg class="route" viewBox="0 0 1080 1920"><path id="route" d="M140 1760 C 300 1500, 120 1300, 420 1180 S 900 900, 960 640" fill="none" stroke-width="5" stroke-dasharray="4 18" stroke-linecap="round"/></svg>
    <div class="head"><div class="h1 bh"><span class="mask"><span class="ch" id="Ch1"></span></span></div><div class="h2 bb" id="Ch2"></div></div>
    <div id="Cards"></div>
  </div>
  <div class="layer" id="D">
    <svg class="ridges" id="ridges2" viewBox="0 0 1280 1920" style="position:absolute;left:-100px;top:0;width:1280px;height:1920px"></svg>
    <div class="head"><div class="h1 bh"><span class="mask"><span class="ch" id="Dh1"></span></span></div><div class="h2 bb" id="Dh2"></div></div>
    <div class="big" id="Dbig"><img id="DbigImg"></div>
    <div class="chips" id="Dchips"></div>
    <div class="small" id="Dsmall"><img id="DsmallImg"></div>
  </div>
  <div class="layer" id="E">
    <div class="k"><span class="mask"><span class="ch" id="Ek"></span></span></div>
    <div class="duo"><img class="l1" id="El1"><div class="x" id="Ex">×</div><img class="l2" id="El2" src="assets/logo-circulo.png"></div>
    <div class="ca" id="Eca">Casa Amiga</div>
    <div class="loc" id="Eloc">Vereda El Placer · Santa Elena</div>
    <div class="card" id="Ecard"><div class="url"><span id="Eurl"></span></div><div class="hs" id="Ehs"></div></div>
  </div>
  <div id="wipe"></div>
  <div id="badge"><img src="assets/logo-circulo.png"><span id="badgeTxt">Esto lo puedes encontrar en Casa Amiga</span></div>
  <div id="vig"></div><div id="grain"></div>
</div>
<script>
const B=window.BRAND;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t, p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, ei=x=>x*x*x;
const soft=x=>{const c=.8,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rise=(el,x,d=110)=>{el.style.transform=`translateY(${(1-eo(x))*d}%)`};
// --- aplicar configuración de marca
const R=document.documentElement.style;
for(const [k,v] of Object.entries({bA:B.colors.a,bB:B.colors.b,bB2:B.colors.b2||B.colors.b,bPaper:B.colors.paper,bInk:B.colors.ink,bCream:B.colors.cream,bHead:B.fonts.head,bBody:B.fonts.body,bMono:B.fonts.mono,bHeadC:B.colors.headC||B.colors.a})) R.setProperty('--'+k,v);
$('At3').textContent=B.introTag||'';
$('BlogoImg').src=B.logo; $('Bname').innerHTML=B.name.map(l=>`<span class="mask"><span class="ch">${l}</span></span>`).join('<br>');
if(B.nameFont){const n=$('Bname');n.style.fontFamily=B.nameFont;n.style.fontSize=(B.nameSize||104)+'px';n.style.textTransform=B.nameCase||'uppercase';n.style.lineHeight='1.1';}
if(B.lightBg){$('Blogo').style.boxShadow='0 36px 80px rgba(90,40,30,.28),0 0 0 14px rgba(255,255,255,.8)';}
$('Bhandle').textContent=B.handle; $('Btag').textContent=B.tagline;
$('Ch1').textContent=B.travel.title; $('Ch2').textContent=B.travel.sub; $('route').setAttribute('stroke',B.colors.b);
const CARD_POS=[{l:90,t:640,w:560,h:640,r:-5,s:{l:720,t:720,r:-14}},{l:430,t:1050,w:560,h:600,r:4,s:{l:120,t:1480,r:10}}];
B.travel.cards.forEach((c,i)=>{const P=CARD_POS[i];const d=document.createElement('div');d.className='pc';Object.assign(d.style,{left:P.l+'px',top:P.t+'px',width:P.w+'px',height:(P.h+90)+'px'});
  d.innerHTML=`<div class="ph"><img src="${c.img}" style="object-position:${c.pos||'50% 50%'}"></div><div class="cap">${c.cap||''}</div>`;$('Cards').appendChild(d);
  const s=document.createElement('div');s.className='stamp';Object.assign(s.style,{left:P.s.l+'px',top:P.s.t+'px'});s.innerHTML=`<b>${c.stamp[0]}</b><i>${c.stamp[1]}</i>`;$('Cards').appendChild(s);});
$('Dh1').textContent=B.product.title; $('Dh2').textContent=B.product.sub; $('DbigImg').src=B.product.big; $('DsmallImg').src=B.product.small;
$('DbigImg').style.objectPosition=B.product.bigPos||'50% 50%'; $('DsmallImg').style.objectPosition=B.product.smallPos||'50% 50%';
B.product.chips.forEach(c=>{const d=document.createElement('div');d.textContent=c;$('Dchips').appendChild(d)});
$('Ek').textContent=B.cta||'Encuéntralo en'; $('El1').src=B.logo;
$('El1').style.boxShadow='0 26px 60px rgba(0,0,0,.25),0 0 0 10px rgba(255,255,255,.85)';
$('Ehs').innerHTML=`<span>${B.handle}</span> · <span>@galeria.casaamiga</span>`;
// montañas de líneas (identidad de la marca)
function ridges(svg,seed){let h='';for(let k=0;k<9;k++){let y=300+k*190,d=`M0 ${y}`;for(let x=0;x<=1280;x+=40){const v=Math.sin((x+seed*90+k*57)/170)*60+Math.sin((x*1.7+k*31)/90)*22-Math.abs(Math.sin((x+k*130)/420))*120;d+=` L${x} ${(y+v).toFixed(1)}`}h+=`<path d="${d}" fill="none" stroke="${B.colors.cream}" stroke-opacity="${.05+k*.008}" stroke-width="3"/>`}svg.innerHTML=h}
function brush(svg,seed){const cols=B.brushColors||[B.colors.b];let h='<defs><filter id="bl'+seed+'" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter></defs>';
  for(let k=0;k<7;k++){const c=cols[(k+seed)%cols.length],x=((k*389+seed*211)%1100)-60,y=((k*577+seed*97)%1800)+40,w=380+((k*131)%260),r=-35+((k*53+seed*29)%70);
    h+=`<g transform="translate(${x} ${y}) rotate(${r})" filter="url(#bl${seed})" opacity="${.32+(k%3)*.06}"><rect x="${-w/2}" y="-60" width="${w}" height="120" rx="60" fill="${c}"/><rect x="${-w/2+40}" y="-30" width="${w*.7}" height="70" rx="35" fill="${c}"/></g>`}
  svg.innerHTML=h}
function waves(svg,seed){let h='';for(let k=0;k<14;k++){let y=120+k*130,d=`M0 ${y}`;for(let x=0;x<=1280;x+=20){d+=` L${x} ${(y+Math.sin((x+k*70+seed*40)/95)*18+Math.sin((x*.5+k*33)/60)*6).toFixed(1)}`}h+=`<path d="${d}" fill="none" stroke="${B.colors.cream}" stroke-opacity="${.07+(k%3)*.025}" stroke-width="3"/>`}svg.innerHTML=h}
function diamonds(svg,seed){let h='';const cx=[640,180,1100,380,900][seed%5],cy=[960,420,1500,1650,300][seed%5];for(let k=1;k<12;k++){const r=k*110;h+=`<path d="M${cx} ${cy-r} L${cx+r} ${cy} L${cx} ${cy+r} L${cx-r} ${cy} Z" fill="none" stroke="${B.colors.cream}" stroke-opacity="${.05+(k%3)*.03}" stroke-width="4"/>`}svg.innerHTML=h}
const DEC={brush,waves,diamonds,ridges};const dec=DEC[B.decor]||ridges;dec($('ridges'),1);dec($('ridges2'),4);
const URL='casa-amiga-henna.vercel.app';
const S={A:[0,3.9],B:[3.6,9.2],C:[9.0,15.6],D:[15.4,21.4],E:[21.2,29.0]};const DUR=29.0;
function show(id,t){const [a,b]=S[id];const on=t>=a&&t<b;$(id).style.display=on?'block':'none';return on?t-a:null}
async function render(t){let u;
  if((u=show('A',t))!==null){
    $('Alogo').style.transform=`scale(${soft(p(u,.1,1.4))}) rotate(${lerp(-10,0,eo(p(u,.1,1.3)))}deg)`;$('Alogo').style.opacity=eo(p(u,.1,.5));
    const a=p(u,.9,1.5),b=p(u,1.2,1.9),c=p(u,1.7,2.3);
    $('At1').style.opacity=a;$('At1').style.transform=`translateY(${(1-eo(a))*30}px)`;
    $('At2').style.opacity=b;$('At2').style.transform=`translateY(${(1-eo(b))*40}px) scale(${lerp(.9,1,eo(b))})`;
    $('At3').style.opacity=c;$('At3').style.transform=`translateY(${(1-eo(c))*30}px)`;
  }
  // barrido de color desde el logo de Casa Amiga
  const w=p(t,3.0,3.9);$('wipe').style.display=(w>0&&w<1)?'block':'none';$('wipe').style.clipPath=`circle(${eio(w)*1500}px at 50% 40%)`;
  if((u=show('B',t))!==null){
    const x=p(u,.2,1.6);$('Blogo').style.transform=`scale(${lerp(.6,1,soft(x))}) rotate(${lerp(-25,0,eo(x))}deg)`;$('Blogo').style.opacity=eo(p(u,.2,.7));
    [...$('Bname').querySelectorAll('.ch')].forEach((c,i)=>rise(c,p(u,1.2+i*.2,2.0+i*.2)));
    const h=p(u,2.0,2.7),g=p(u,2.4,3.2);$('Bhandle').style.opacity=h;$('Btag').style.opacity=g;$('Btag').style.transform=`translateY(${(1-eo(g))*30}px)`;
    $('ridges').style.transform=`translateY(${-u*14}px)`;
  }
  if((u=show('C',t))!==null){
    rise($('Ch1'),p(u,.2,1.0));const s=p(u,.6,1.3);$('Ch2').style.opacity=s;$('Ch2').style.transform=`translateY(${(1-eo(s))*30}px)`;
    const rt=$('route');const L=1900;rt.style.strokeDashoffset=0;rt.style.opacity=.6;rt.setAttribute('stroke-dasharray',`4 18`);rt.style.clipPath=`inset(${(1-eio(p(u,.3,3.5)))*100}% 0 0 0)`;
    const els=[...$('Cards').children];
    for(let i=0;i<els.length;i+=2){const k=i/2,P=CARD_POS[k];const c=els[i],st=els[i+1];
      const x=p(u,1.0+k*1.5,2.2+k*1.5);c.style.opacity=eo(p(u,1.0+k*1.5,1.5+k*1.5));
      c.style.transform=`translate(${(1-eo(x))*(k?700:-700)}px,${(1-eo(x))*120+Math.sin(u*1.6+k)*5}px) rotate(${lerp(P.r*3,P.r,eo(x))}deg)`;
      c.querySelector('img').style.transform=`scale(${lerp(1.2,1.05,eo(p(u,1.0+k*1.5,6.5)))})`;
      const sx=p(u,2.3+k*1.5,2.75+k*1.5);st.style.opacity=sx>0?.88:0;st.style.transform=`rotate(${P.s.r}deg) scale(${lerp(1.8,1,eo(sx))})`;}
  }
  if((u=show('D',t))!==null){
    rise($('Dh1'),p(u,.2,1.0));const s=p(u,.6,1.3);$('Dh2').style.opacity=s;$('Dh2').style.transform=`translateY(${(1-eo(s))*30}px)`;
    const x=eo(p(u,.4,1.6)),i=(1-x)*50;$('Dbig').style.clipPath=`inset(${i}% ${i}% ${i}% ${i}% round 40px)`;$('DbigImg').style.transform=`scale(${lerp(1.3,1.05,eo(p(u,.4,6)))})`;
    const y=p(u,1.3,2.4);$('Dsmall').style.opacity=y>0?1:0;$('Dsmall').style.transform=`translate(${(1-eo(y))*600}px,${Math.sin(u*1.6)*6}px) rotate(${lerp(14,4,eo(y))}deg)`;
    [...$('Dchips').children].forEach((d,k)=>{const z=p(u,1.8+k*.3,2.4+k*.3);d.style.opacity=z;d.style.transform=`translateX(${(1-eo(z))*80}px)`});
    $('ridges2').style.transform=`translateY(${-u*14}px)`;
  }
  if((u=show('E',t))!==null){
    $('E').style.opacity=eo(p(u,0,.5));
    rise($('Ek'),p(u,.2,1.0));
    const a=p(u,.6,1.6),b=p(u,1.0,2.0);$('El1').style.transform=`scale(${lerp(.5,1,soft(a))})`;$('El1').style.opacity=eo(p(u,.6,1));
    $('El2').style.transform=`scale(${lerp(.5,1,soft(b))})`;$('El2').style.opacity=eo(p(u,1.0,1.4));
    const xx=p(u,1.4,2.0);$('Ex').style.opacity=xx;
    const c=p(u,1.8,2.5);$('Eca').style.opacity=c;$('Eca').style.transform=`translateY(${(1-eo(c))*30}px)`;
    $('Eloc').style.opacity=p(u,2.2,2.8);
    const d=p(u,2.5,3.2);$('Ecard').style.opacity=d;$('Ecard').style.transform=`translateY(${(1-eo(d))*80}px)`;
    $('Eurl').textContent=URL.slice(0,Math.floor(clamp((u-3.0)/1.4)*URL.length));$('Ehs').style.opacity=p(u,4.4,5.0);
  }
  // badge Casa Amiga (arriba) durante la marca
  // letrero fijo "Esto lo puedes encontrar en Casa Amiga" desde que aparece la marca hasta el final
